<html lang="en">

<title>SXAR — One Place. Many Possibilities.</title>

* {

  padding: 0;

}

html {
  scroll-behavior: smooth;
}

body {

  color: white;

header {

}

.menu {

}

.hero {
  padding: 70px 20px;
  text-align: center;
}

  font-size: 44px;
  margin-bottom: 15px;
}

.hero h1 span {
  color: #00ff88;

.hero p {
  color: #aaa;

}

.btn {
  display: inline-block;
  background: #00ff88;

  border: none;
  cursor: pointer;
  transition: 0.2s;
}

.btn:hover {
  transform: scale(1.04);

.section {
  padding: 35px 18px;
  max-width: 900px;
  margin: auto;
}

.section h2 {
  margin-bottom: 20px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.card {
  background: #151515;
  border: 1px solid #252525;
  border-radius: 15px;
  padding: 20px;
  min-height: 145px;
  cursor: pointer;
  transition: 0.2s;
}

.card:hover {
  border-color: #00ff88;
  transform: translateY(-3px);

.card .icon {
  font-size: 30px;
  margin-bottom: 12px;
}

.card h3 {
  margin-bottom: 7px;
}

.card p {
  color: #999;
  font-size: 13px;
  line-height: 1.5;
}

.page {
  display: none;
  padding: 50px 20px;
  min-height: 65vh;
  max-width: 850px;
  margin: auto;
}

.page.active {
  display: block;
}

.page h2 {
  color: #00ff88;
  margin-bottom: 15px;
  font-size: 32px;
}

.page p {
  color: #aaa;
  line-height: 1.7;
  margin-bottom: 25px;
}

.back {
  margin-top: 10px;
  background: #222;
  color: white;
}

.join {
  margin: 30px 18px 50px;
  padding: 35px 20px;
  background: #111;
  border: 1px solid #252525;
  border-radius: 20px;
  text-align: center;
}

.join p {
  color: #999;
  margin: 15px 0 22px;
}
